{
  name: "Mirror to Git Forges",
  on: {
    push: {
      branches: [
        "main",
      ],
    },
    workflow_dispatch: null,
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: false,
  },
  permissions: {
    actions: "read", # required by the reusable workflow
    contents: "read",
  },
  jobs: {
    mirror: {
      uses: "hyperpolymath/standards/.github/workflows/mirror-reusable.yml@900c42c70b968e11a2bca04bf0ce050be5c286dc",
      # Each forge job is still gated on vars.<FORGE>_MIRROR_ENABLED, inside the
      # callee. Explicit secrets map, no secrets: inherit; these seven are the
      # callee's complete optional contract at 900c42c70b968e11a2bca04bf0ce050be5c286dc.
      secrets: {
        GITLAB_SSH_KEY: "${{ secrets.GITLAB_SSH_KEY }}",
        BITBUCKET_SSH_KEY: "${{ secrets.BITBUCKET_SSH_KEY }}",
        CODEBERG_SSH_KEY: "${{ secrets.CODEBERG_SSH_KEY }}",
        SOURCEHUT_SSH_KEY: "${{ secrets.SOURCEHUT_SSH_KEY }}",
        DISROOT_SSH_KEY: "${{ secrets.DISROOT_SSH_KEY }}",
        GITEA_SSH_KEY: "${{ secrets.GITEA_SSH_KEY }}",
        RADICLE_KEY: "${{ secrets.RADICLE_KEY }}",
      },
    },
  },
}
