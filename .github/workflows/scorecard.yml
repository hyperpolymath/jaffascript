# SPDX-License-Identifier: MPL-2.0
name: Scorecards supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'

permissions: read-all

jobs:
  analysis:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@900c42c70b968e11a2bca04bf0ce050be5c286dc
    # A job-level map replaces the workflow-level one, so every scope the
    # callee's jobs request must be listed here. actions: read is new in the
    # callee since 81dbf2dd. No secrets: the callee declares and reads none.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
