# SPDX-License-Identifier: MPL-2.0
name: Scorecards supply-chain security

on:
  branch_protection_rule:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  analysis:
    uses: hyperpolymath/standards/.github/workflows/scorecard-reusable.yml@2e12b312b529c51f095ce3b22cd35968f5aba898
    # A job-level map replaces the workflow-level one, so every scope the
    # callee's jobs request must be listed here. actions: read is new in the
    # callee since 81dbf2dd. No secrets: the callee declares and reads none.
    permissions:
      actions: read
      contents: read
      security-events: write
      id-token: write
