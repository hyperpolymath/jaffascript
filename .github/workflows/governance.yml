{
  name: "Governance",
  on: {
    push: {
      branches: [
        "main",
        "master",
      ],
    },
    pull_request: {
      branches: [
        "main",
        "master",
      ],
    },
    workflow_dispatch: null,
  },
  concurrency: {
    group: "${{ github.workflow }}-${{ github.ref }}",
    cancel-in-progress: true,
  },
  permissions: {
    actions: "read", # required by the reusable workflow (staleness check reads workflow runs)
    contents: "read",
  },
  jobs: {
    governance: {
      uses: "hyperpolymath/standards/.github/workflows/governance-reusable.yml@900c42c70b968e11a2bca04bf0ce050be5c286dc",
    },
  },
}
